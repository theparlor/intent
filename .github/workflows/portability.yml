name: portability
on: [push, pull_request]
jobs:
  no-hardcoded-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q pytest
      - run: python -m pytest hooks/tests/test_no_hardcoded_home.py -q
      - name: syntax check every hook by its shebang (some .sh hooks are Python)
        run: |
          set -e
          for f in hooks/*.sh; do
            [ -f "$f" ] || continue
            case "$(head -1 "$f")" in
              *python*) python -m py_compile "$f" ;;
              *)        bash -n "$f" ;;
            esac
          done

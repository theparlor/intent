name: portability
on: [push, pull_request]
jobs:
  no-hardcoded-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -q pytest
      - run: python -m pytest hooks/tests/test_no_hardcoded_home.py -q
      - name: bash syntax on every hook
        run: find hooks -maxdepth 1 -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n
